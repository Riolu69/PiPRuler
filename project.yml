name: PiPRuler
options:
  bundleIdPrefix: com.ruler
targets:
  PiPRuler:
    type: application
    platform: iOS
    deploymentTarget: "15.0"
    sources: [Sources]
    settings:
      base:
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGN_IDENTITY: ""
    info:
      path: Info.plist
      properties:
        UIBackgroundModes: [audio]
        UILaunchStoryboardName: ""
